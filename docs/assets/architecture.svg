<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="title desc">
<title id="title">Metron headless architecture</title>
<desc id="desc">Human app and programmatic clients both call the same calculation engine, which depends on typed observations, model assumptions, and returns structured outcomes. Optional future adapters are separate.</desc>
<rect width="1080" height="360" rx="16" fill="#ffffff"/>
<rect x="16" y="16" width="1048" height="328" rx="13" fill="#fafafa" stroke="#e5e5e5"/>
