name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run zero-install checks
        run: npm run ci
      - name: Verify source-inspection privacy guards
        run: python3 -m unittest discover -s research/ree-validation/tools -p 'test_*.py' -v
      - name: Validate release package
        run: npm run release:check
      - name: Headless examples
        run: |
          node bin/metron.mjs --file examples/beginner.json > /tmp/beginner-output.json
          node bin/metron.mjs --file examples/strength-athlete.json > /tmp/athlete-output.json
          node -e "const a=require('/tmp/beginner-output.json'); if(!Number.isFinite(a.energy.estimatedTdeeKcal)) process.exit(1)"
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the site under test
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check synthetic UI states and capture review images
        run: python research/robustness/h7/browser_check.py
