<text x="184" y="88" font-size="19" font-weight="700" fill="#171717">Human instrument</text><text x="184" y="114" font-size="13" fill="#525252">TDEE · Readiness · Body</text>
<rect x="759" y="54" width="273" height="87" rx="10" fill="#ffffff" stroke="#d4d4d4"/>
<text x="896" y="88" font-size="19" font-weight="700" fill="#171717">Agents &amp; builders</text><text x="896" y="114" font-size="13" fill="#525252">ESM · CLI · JSON Schema</text>
<rect x="381" y="173" width="318" height="93" rx="11" fill="#f7f7f8" stroke="#525252" stroke-width="2"/>
<text x="540" y="208" font-size="23" font-weight="700" fill="#525252">Headless core</text><text x="540" y="236" font-size="13" fill="#525252">Deterministic · inspectable · offline</text>
<path d="M185 141V161H460V173M896 141V161H620V173" fill="none" stroke="#737373" stroke-width="2"/>
