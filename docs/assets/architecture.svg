<text x="540" y="306" font-size="13" font-weight="600" fill="#525252">Equations + disclosed limits</text>
<rect x="740" y="280" width="292" height="42" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
<text x="886" y="306" font-size="13" font-weight="600" fill="#525252">JSON results + status</text>
