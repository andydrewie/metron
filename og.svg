<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Metron — open fitness instrument</title>
<desc id="desc">An original, restrained-color identity with centered typography and a simple energy estimate. No external brand marks.</desc>
<rect width="1200" height="630" fill="#fff"/>
<g text-anchor="middle" fill="#252A30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
  <text x="600" y="172" font-size="64" font-weight="650" letter-spacing="-3">metron</text>
  <text x="600" y="216" font-size="20" font-weight="400" fill="#52606B">Daily Energy, Readiness, &amp; Caloric Allowance</text>
</g>
<rect x="318" y="263" width="564" height="224" rx="18" fill="#f7f7f7" stroke="#e5e5e5" stroke-width="1"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="600" y="310" font-size="16" fill="#52606B">Estimated daily expenditure</text>
<text x="600" y="391" font-size="68" fill="#252A30" font-weight="650" letter-spacing="-2">2,500</text>
<text x="600" y="424" font-size="16" fill="#52606B">kcal / day</text>
</g>
<rect x="367" y="452" width="466" height="10" rx="5" fill="#e5e5e5"/>
<path d="M372 452H734V462H372Z" fill="#586674"/><path d="M738 452H782V462H738Z" fill="#0072B2"/><path d="M786 452H828V462H786Z" fill="#B45309"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="15" fill="#66727B">
<text x="600" y="545">Open source · Headless · MIT licensed</text>
</g>
</svg>
